# TinyCLIP fue entrenado principalmente con texto en inglés. Varias plantillas
# reducen la dependencia de una única formulación y permiten probar también
# ilustraciones y juguetes sin cambiar el código.
templates:
  - a photo of {subject}
  - a close-up photo of {subject}
  - a clear picture of {subject}
  - a children's illustration of {subject}
  - a toy shaped like {subject}

classes:
  vaca: {subjects: [a cow, cattle]}
  caballo: {subjects: [a horse]}
  cerdo: {subjects: [a domestic pig, a piglet]}
  oveja: {subjects: [a sheep, a lamb]}
  cabra: {subjects: [a goat]}
  burro: {subjects: [a donkey]}
  gallina: {subjects: [a chicken, a rooster, a chick]}
  pato: {subjects: [a duck]}
  perro: {subjects: [a domestic dog, a puppy]}
  gato: {subjects: [a domestic cat, a kitten]}
  conejo: {subjects: [a rabbit]}
  hamster: {subjects: [a hamster]}
  tortuga: {subjects: [a turtle, a tortoise]}
  pez: {subjects: [a fish]}
  loro: {subjects: [a parrot, a macaw, a cockatoo, a parakeet]}
  leon: {subjects: [a lion]}
  tigre: {subjects: [a tiger]}
  elefante: {subjects: [an elephant]}
  jirafa: {subjects: [a giraffe]}
  cebra: {subjects: [a zebra]}
  mono: {subjects: [a monkey, an ape]}
