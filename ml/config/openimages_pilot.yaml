    name: Penguin
    exclude_image_ids: [a76339c122dbfce8]
  koala:
    name: Koala
    exclude_image_ids: [317993967134700a]

# Open Images validation no aporta cinco cajas limpias para estas clases. Se
# reutilizan fotografías concretas ya inspeccionadas del piloto iNaturalist;
# los índices son 1-based dentro de cada hoja de contacto de pilot_v1.
reviewed_inaturalist:
  burro: [2, 3, 4, 7, 8]
  oveja: [1, 2]
  pato: [5]
  hamster: [2, 4, 6, 7, 9]
  pez: [1]
  leon: [5]
  tigre: [1, 2, 5]
  cebra: [3]
  panda: [1, 4, 5, 6, 7]
  oso: [5]
  cocodrilo: [10, 9]

# Fotos concretas consultadas de nuevo mediante la API de iNaturalist. Esta
# lista se usa cuando el primer piloto no tenía suficientes ejemplares vivos y
# claros de la especie solicitada.
